server:
  listen: 8080 # Reverse proxy is running on port 8080
  workers: 4
  upstreams:
    # - id: posts
    #   url: jsonplaceholder.typicode.com/posts

    # - id: comments
    #   url: jsonplaceholder.typicode.com/comments  ye galt url hai /comments nhi hoga kyunki phir wo ek endpoint ban jayega naa ki url 

    - id:  jsonplaceholder
      url: jsonplaceholder.typicode.com   
      # ye hai mera upstream ka url jaise hum redirect kar rhe request ko kisi server pe uss server ka url hai ye

    - id : dummy
      url: dummyjson.com

  headers:
    - key: x-forward-for
      value: '$ip'

    - key: x-forward-proto
      value: '$scheme'

  rules:
    - path: /todos
      upstream: 
        - jsonplaceholder

    - path: /posts
      upstream: 
        - jsonplaceholder

    - path: /comments
      upstream: 
        - jsonplaceholder

    - path: /test
      upstream:
        - dummy

  

# So the thing is we are getting redirected to upstream means upsteam+path so upstream/path
